<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zero-Trust Focus</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1225;
      color: #e2e8f0;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shield {
      font-size: 1.3rem;
    }
    h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #06d6a0;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    input:focus {
      border-color: #06d6a0;
      box-shadow: 0 0 0 2px rgba(6, 214, 160, 0.2);
    }
    button {
      padding: 10px;
      background: linear-gradient(135deg, #06d6a0, #059669);
      color: #0a0e1a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: transform 0.15s, opacity 0.15s;
    }
    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    #status {
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }
    .connected-badge {
      color: #22c55e !important;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="shield">🛡️</span>
      <h3>Zero-Trust Focus</h3>
    </div>
    <div class="input-group">
      <input type="text" id="username" placeholder="Your Username" />
      <input type="password" id="roomId" placeholder="Room Password" />
    </div>
    <button id="connectBtn">Connect Extension</button>
    <div id="status">Status: Disconnected</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
