<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sagu — Zero-Trust Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 310px;
      padding: 18px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      background: radial-gradient(circle at 50% 0%, rgba(78, 222, 163, 0.1) 0%, rgba(13, 16, 26, 0.98) 60%), #0a0c16;
      color: #f4f4f5;
      user-select: none;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle ambient glass glow */
    body::before {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 80px;
      background: radial-gradient(ellipse, rgba(78, 222, 163, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* --- Sagu Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .sagu-logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4edea3;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 0 14px rgba(78, 222, 163, 0.28);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a1a1aa;
      font-weight: 600;
    }

    .version-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(78, 222, 163, 0.1);
      border: 1px solid rgba(78, 222, 163, 0.25);
      color: #4edea3;
      font-size: 10px;
      font-weight: 600;
    }

    .sagu-dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4edea3;
      box-shadow: 0 0 8px #4edea3;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    /* --- Input Card --- */
    .input-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      background: rgba(10, 14, 24, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      color: #f4f4f5;
      font-size: 0.84rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder {
      color: #71717a;
      font-size: 0.8rem;
    }

    input:focus {
      border-color: rgba(78, 222, 163, 0.6);
      background: rgba(14, 20, 34, 0.8);
      box-shadow: 0 0 14px rgba(78, 222, 163, 0.2), inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .password-input {
      padding-right: 36px !important;
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.2s;
      user-select: none;
    }

    .eye-btn:hover {
      opacity: 1;
    }

    /* --- Translucent Connect Button --- */
    #connectBtn {
      width: 100%;
      padding: 10px 14px;
      background: rgba(78, 222, 163, 0.14);
      border: 1px solid rgba(78, 222, 163, 0.4);
      color: #4edea3;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.86rem;
      font-family: inherit;
      letter-spacing: 0.01em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(78, 222, 163, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #connectBtn:hover {
      background: rgba(78, 222, 163, 0.25);
      border-color: #4edea3;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 0 22px rgba(78, 222, 163, 0.38);
    }

    #connectBtn:active {
      transform: translateY(0);
    }

    /* --- Status Line --- */
    #status {
      font-size: 0.76rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .connected-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(78, 222, 163, 0.12);
      border: 1px solid rgba(78, 222, 163, 0.3);
      border-radius: 9999px;
      padding: 3px 10px;
      color: #4edea3 !important;
      font-weight: 600;
      font-size: 0.74rem;
    }

    /* --- Sound Settings Section --- */
    details {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    details[open] {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(78, 222, 163, 0.28);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    summary {
      color: #d4d4d8;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      user-select: none;
      outline: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    summary:hover {
      color: #4edea3;
    }

    summary::-webkit-details-marker {
      color: #4edea3;
    }

    .settings-body {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-label {
      font-size: 0.75rem;
      color: #a1a1aa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .setting-label .val-tag {
      color: #4edea3;
      font-weight: 600;
      font-size: 0.74rem;
    }

    /* Sound Selector + Test Button Row */
    .sound-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cyber-select {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(10, 14, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f4f4f5;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cyber-select:focus {
      border-color: rgba(78, 222, 163, 0.6);
      box-shadow: 0 0 10px rgba(78, 222, 163, 0.2);
    }

    .test-sound-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(78, 222, 163, 0.12);
      border: 1px solid rgba(78, 222, 163, 0.35);
      color: #4edea3;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      min-width: 62px;
    }

    .test-sound-btn:hover {
      background: rgba(78, 222, 163, 0.24);
      border-color: #4edea3;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .test-sound-btn.playing {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }

    .test-sound-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #64748b;
      transform: none;
    }

    /* Custom audio upload area */
    .custom-sound-box {
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(78, 222, 163, 0.35);
      border-radius: 8px;
      text-align: center;
    }

    .upload-label {
      display: inline-block;
      font-size: 0.74rem;
      color: #38bdf8;
      cursor: pointer;
      font-weight: 600;
      transition: color 0.2s;
    }

    .upload-label:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .file-chosen-hint {
      font-size: 0.7rem;
      color: #a1a1aa;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Volume Slider */
    .cyber-range {
      width: 100%;
      height: 4px;
      accent-color: #4edea3;
      cursor: pointer;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sagu Unified Header -->
    <div class="header">
      <div class="brand-left">
        <div class="sagu-logo-badge">S</div>
        <div class="brand-text">
          <span class="brand-name">Sagu</span>
          <span class="brand-sub">Zero-Trust Sync</span>
        </div>
      </div>
      <div class="version-pill">
        <span class="sagu-dot-live"></span>
        <span>Active</span>
      </div>
    </div>

    <!-- Credentials Card -->
    <div class="input-card">
      <div class="input-wrapper">
        <input type="text" id="username" placeholder="Your Username" spellcheck="false" autocomplete="off" />
      </div>
      <div class="input-wrapper">
        <input type="password" id="roomId" class="password-input" placeholder="Room Password" spellcheck="false" autocomplete="off" />
        <button type="button" id="togglePasswordBtn" class="eye-btn" title="Toggle password visibility">👁️</button>
      </div>
    </div>

    <!-- Connect Action -->
    <button id="connectBtn">
      <span>Connect Extension</span>
    </button>

    <!-- Connection Status -->
    <div id="status">Status: Disconnected</div>

    <!-- Settings panel for sound preferences -->
    <details>
      <summary>🔊 Sound Settings</summary>
      <div class="settings-body">
        <div>
          <div class="setting-label">
            <span>Alert sound:</span>
          </div>
          <div class="sound-row">
            <select id="soundChoice" class="cyber-select">
              <option value="none">🔇 Mute (No sound)</option>
              <option value="alarm">🚨 Short Alarm</option>
              <option value="buzzer">📣 Funny Buzzer</option>
              <option value="custom">🎵 Custom Audio</option>
            </select>
            <button id="testSoundBtn" type="button" class="test-sound-btn" title="Click to test sound">
              <span id="testSoundIcon">▶</span>
              <span id="testSoundText">Test</span>
            </button>
          </div>
        </div>

        <!-- Upload box when custom sound is selected -->
        <div id="customSoundWrapper" class="custom-sound-box" style="display:none;">
          <label for="customSound" class="upload-label">
            📁 Choose audio file (.mp3, .wav)
          </label>
          <input type="file" id="customSound" accept="audio/*" style="display:none;" />
          <div id="customSoundName" class="file-chosen-hint">No file selected yet</div>
        </div>

        <div>
          <div class="setting-label">
            <span>Volume:</span>
            <span id="volumeValTag" class="val-tag">70%</span>
          </div>
          <input type="range" id="soundVolume" min="0" max="100" value="70" class="cyber-range" />
        </div>
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
