<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zero-Trust Focus</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1225;
      color: #e2e8f0;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shield {
      font-size: 1.3rem;
    }
    h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #06d6a0;
      letter-spacing: 0.3px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .password-input {
      padding-right: 36px !important;
    }
    .eye-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.2s;
      user-select: none;
    }
    .eye-btn:hover {
      opacity: 1;
      transform: none;
    }
    input:focus {
      border-color: #06d6a0;
      box-shadow: 0 0 0 2px rgba(6, 214, 160, 0.2);
    }
    #connectBtn {
      padding: 10px;
      background: linear-gradient(135deg, #06d6a0, #059669);
      color: #0a0e1a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    }
    #connectBtn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(6, 214, 160, 0.25);
    }
    #status {
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }
    .connected-badge {
      color: #22c55e !important;
      font-weight: 600;
    }

    /* Sound Settings Section */
    details {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 10px 12px;
      transition: all 0.2s ease;
    }
    details[open] {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(6, 214, 160, 0.28);
    }
    summary {
      color: #06d6a0;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
      user-select: none;
      outline: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    summary::-webkit-details-marker {
      color: #06d6a0;
    }
    .settings-body {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .setting-label {
      font-size: 0.76rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-label .val-tag {
      color: #06d6a0;
      font-weight: 600;
      font-size: 0.75rem;
    }

    /* Sound Selector + Test Button Row */
    .sound-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cyber-select {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f1f5f9;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .cyber-select:focus {
      border-color: #06d6a0;
      box-shadow: 0 0 0 2px rgba(6, 214, 160, 0.2);
    }
    .test-sound-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(6, 214, 160, 0.12);
      border: 1px solid rgba(6, 214, 160, 0.4);
      color: #06d6a0;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      min-width: 68px;
    }
    .test-sound-btn:hover {
      background: rgba(6, 214, 160, 0.25);
      border-color: #06d6a0;
      transform: translateY(-1px);
    }
    .test-sound-btn.playing {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }
    .test-sound-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #64748b;
      transform: none;
    }

    /* Custom audio upload area */
    .custom-sound-box {
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed rgba(6, 214, 160, 0.35);
      border-radius: 8px;
      text-align: center;
    }
    .upload-label {
      display: inline-block;
      font-size: 0.75rem;
      color: #38bdf8;
      cursor: pointer;
      font-weight: 600;
      transition: color 0.2s;
    }
    .upload-label:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
    .file-chosen-hint {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Volume Slider & Cooldown Inputs */
    .cyber-range {
      width: 100%;
      height: 5px;
      accent-color: #06d6a0;
      cursor: pointer;
      margin-top: 2px;
    }
    .cyber-number {
      width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .cyber-number:focus {
      border-color: #06d6a0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="shield">🛡️</span>
      <h3>Zero-Trust Focus</h3>
    </div>
    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" id="username" placeholder="Your Username" />
      </div>
      <div class="input-wrapper">
        <input type="password" id="roomId" class="password-input" placeholder="Room Password" />
        <button type="button" id="togglePasswordBtn" class="eye-btn" title="Hover to view password">👁️</button>
      </div>
    </div>
    <button id="connectBtn">Connect Extension</button>
    <div id="status">Status: Disconnected</div>
  </div>

  <!-- Settings panel for sound preferences -->
  <details>
    <summary>🔊 Sound Settings</summary>
    <div class="settings-body">
      <div>
        <div class="setting-label">
          <span>Alert sound:</span>
        </div>
        <div class="sound-row">
          <select id="soundChoice" class="cyber-select">
            <option value="none">🔇 Mute (No sound)</option>
            <option value="alarm">🚨 Short Alarm</option>
            <option value="buzzer">📣 Funny Buzzer</option>
            <option value="custom">🎵 Custom Audio</option>
          </select>
          <button id="testSoundBtn" type="button" class="test-sound-btn" title="Click to test sound">
            <span id="testSoundIcon">▶</span>
            <span id="testSoundText">Test</span>
          </button>
        </div>
      </div>

      <!-- Upload box when custom sound is selected -->
      <div id="customSoundWrapper" class="custom-sound-box" style="display:none;">
        <label for="customSound" class="upload-label">
          📁 Choose audio file (.mp3, .wav)
        </label>
        <input type="file" id="customSound" accept="audio/*" style="display:none;" />
        <div id="customSoundName" class="file-chosen-hint">No file selected yet</div>
      </div>

      <div>
        <div class="setting-label">
          <span>Volume:</span>
          <span id="volumeValTag" class="val-tag">70%</span>
        </div>
        <input type="range" id="soundVolume" min="0" max="100" value="70" class="cyber-range" />
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
